# Layer 4 Level 1 floor manifest -- NCT03637764
#
# Level 1 = floor shell + real epochs + the SoA. Only study identity and the
# epoch list are read; everything else in the shell is a flagged placeholder
# supplied by soa2usdm.floor.
#
# Sources, per fact:
#   protocol document  -- NCT03637764.pdf / .md in this collection (posted
#                         Amended Clinical Trial Protocol 05, ACT15377)
#   ClinicalTrials.gov -- sponsor name and registry identifier, via AACT
#   SDTM CT 2026-03-27 -- epoch type codes, verified as members of codelist C99079
#                         in the NCI EVS package pinned by cdisc-for-ai (2026-09-05)
#
# Hand-authored. Every judgement is called out in a trailing comment.

study:
  id: Study_ACT15377
  name: ACT15377
  label: Safety, preliminary efficacy and PK of isatuximab (SAR650984) alone or in
    combination with atezolizumab in patients with advanced malignancies
  description: null
  version: "05"
  versionRationale: Amended Clinical Trial Protocol 05, approval date 23 November 2020.
  documentRef: NCT03637764 Amended Clinical Trial Protocol 05 (ACT15377), approval
    date 23 November 2020;
  # The CT package the epoch codes were verified against: NCI EVS SDTM CT
  # 2026-03-27, the release pinned by cdisc-for-ai. USDM_CT.xlsx carries no release
  # date of its own, so this names the package actually consulted.
  ctVersion: "2026-03-27"

organizations:
  - slug: sponsor
    name: Sanofi
    ct: org_pharmaceutical
    # The posted protocol's title page prints "Sponsor name:" with no value --
    # the field is blank in the posted document. Name taken from the registry.
    flag: Sponsor name is not printed in the posted protocol document; taken from
      the ClinicalTrials.gov record for NCT03637764.
  - slug: ctgov
    name: ClinicalTrials.gov
    ct: org_registry
    flag: Registry identity, not stated in the protocol document.

identifiers:
  - slug: sponsor
    text: ACT15377
    org: sponsor
    ref: title page, "Protocol number".
  - slug: nct
    text: NCT03637764
    org: ctgov
    ref: "-- registry identifier from ClinicalTrials.gov, not printed on the title page."

titles:
  - ct: title_official
    text: A Phase 1/2 open-label, multi-center, safety, preliminary efficacy and
      pharmacokinetic (PK) study of isatuximab (SAR650984) in combination with
      atezolizumab or isatuximab alone in patients with advanced malignancies
    ref: title page, "Protocol title".
  - ct: title_brief
    text: Safety, preliminary efficacy and PK of isatuximab (SAR650984) alone or in
      combination with atezolizumab in patients with advanced malignancies
    ref: title page, "Short title".

# The epoch list is the only load-bearing protocol reading: ScheduledInstance.epochId
# is the single attribute joining the SoA to the shell. These four are the printed
# values of the SoA's top header band, in printed order.
epochs:
  - slug: screening
    name: SCREENING
    label: Screening (up to 28 days before Day 1)
    ct: epoch_screening
    ref: SCHEDULE OF ACTIVITIES (SOA) table, top header band.
  - slug: treatment
    name: TREATMENT
    label: Treatment Phase
    ct: epoch_treatment
    ref: SCHEDULE OF ACTIVITIES (SOA) table, top header band.
  - slug: eot
    name: EOT
    label: End of Treatment (EOT)
    # JUDGEMENT: C99079 has no End-of-Treatment term. Its 15 members were checked
    # against SDTM CT 2026-03-27; FOLLOW-UP (C202578) is the nearest published
    # submission value, and the EOT visit is scheduled 30 (+/-7) days after the last
    # IMP administration, i.e. after treatment. The same code as the follow-up epoch
    # below -- the two are distinguished by name, not by type.
    # CORRECTED 2026-09-05: this was C228369 Post-Treatment Epoch, chosen from the
    # NCIt hierarchy under C71738. C228369 is NOT a member of C99079. C99079 is
    # extensible, so it was permissible, but not a published submission value.
    ct: epoch_followup
    ref: SCHEDULE OF ACTIVITIES (SOA) table, top header band.
  - slug: followup
    name: FOLLOWUP
    label: Post Treatment Follow-up Phase
    ct: epoch_followup
    ref: SCHEDULE OF ACTIVITIES (SOA) table, top header band.

# The seam. Names the consolidated column property carrying the epoch axis, and
# maps its printed values to the epochs above. This is an interpretation of the
# extraction, resolved here rather than marked in the consolidated schema.
epochAxis:
  property: prop-001
  map:
    Screening (up to 28 days before Day 1): screening
    Treatment Phase: treatment
    End of Treatment (EOT): eot
    Post Treatment Follow-up Phase: followup

# Study days are printed on prop-003. Only plain day values convert mechanically.
# sameValueOf restricts derivation to columns sharing the anchor's prop-002 (cycle)
# value: a day number that restarts each cycle is not a study day, so Cycle 2's
# "D1" must not be emitted as study day 1.
timingAxis:
  property: prop-003
  anchor: xcol-003
  sameValueOf: prop-002

# No encounterAxis: this SoA types its columns as epoch / period / study_day and
# never as visits, so no Encounter is emitted.

terms:
  epoch_screening: ["C202487", "Screening Epoch"]
  epoch_treatment: ["C101526", "Treatment Epoch"]
  epoch_followup: ["C202578", "Follow-Up Epoch"]
  org_pharmaceutical: ["C54149", "Pharmaceutical Company"]
  org_registry: ["C93453", "Clinical Study Registry"]
  title_official: ["C207616", "Official Study Title"]
  title_brief: ["C207615", "Brief Study Title"]
