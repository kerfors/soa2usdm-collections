      "annotation_text": "On all office visits, study participants should be reminded to report to the site before taking study drug (s) in a fasting condition, after a period of approximately 8 hours without eating, drinking (except water), or any significant physical activity. Since some screening procedures need to be completed in the fasting state, Visit 1 may be conducted over more than 1 day to ensure necessary conditions are met.",

    {
      "annotation_marker": "n3",
      "annotation_type": "footnote",
      "annotation_text": "Participants wanting to discontinue the study before Week 72 will be asked to return for Visit 99 at 72 weeks ± 7 days after randomization primarily for body weight measurement and assessment of adverse events. If the participant is unwilling to attend Visit 99, it should be documented in the participant medical record that the participant has refused to attend. Participants wanting to discontinue the study after Week 72 but before Week 176 will be asked to return for Visit 199 primarily for the body weight measurement and assessment of adverse events. Refusal to attend should be documented.",
      "annotation_text_source": {
        "method": "raster_band_cells",
        "note": "note cell bounded by rule lines recovered from the 200 dpi raster of the Additional Information table (document pages 25-28)"
      },

    {
      "annotation_marker": "n4",
      "annotation_type": "footnote",
      "annotation_text": "Participants who are unable or unwilling to continue the study treatment for any reason will perform an ED visit. If the participant is discontinuing during an unscheduled visit or a scheduled visit, that visit should be performed as the ED visit.",
      "annotation_text_source": {
        "method": "raster_band_cells",

    {
      "annotation_marker": "n5",
      "annotation_type": "footnote",
      "annotation_text": "For participants who discontinue or complete the study within the first 72 weeks, Visit 801 (safety follow-up visit) should be performed 4 weeks after the last visit during the 72-week treatment period. Participants with prediabetes continuing to Week 78 should not perform Visit 801. For participants with prediabetes who complete the 176 weeks or discontinue after Week 72, Visit 802 should be performed 17 weeks after the last visit during the additional 2-year treatment period for participants with prediabetes at randomization.",
      "annotation_text_source": {

      "annotation_text": "The visit date is determined in relation to the date of the randomization visit (± the allowed visit window).",

      "annotation_text": "Medical history includes assessment of preexisting conditions (for example, history of gallbladder disease, cardiovascular disease, and medullary thyroid carcinoma) and substance usage (such as alcohol and tobacco).",

      "annotation_text": "ECG measurements should be obtained per the instructions in Section 10.7. ECGs will be performed in triplicate at Weeks 0 and 36. All other ECGs will be single measurements. ECGs should be collected at least 30 minutes prior to collection of blood samples for laboratory testing, including PK samples.",

    function escHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    
    function renderJson(data, indent, isLast) {
        const comma = isLast ? '' : '<span class="json-comma">,</span>';
        if (data === null) return `<span class="json-null">null</span>${comma}`;
        if (typeof data === 'boolean') return `<span class="json-boolean">${data}</span>${comma}`;
        if (typeof data === 'number') return `<span class="json-number">${data}</span>${comma}`;
        if (typeof data === 'string') return `<span class="json-string">"${escHtml(data)}"</span>${comma}`;
        
        const isArray = Array.isArray(data);
        const entries = isArray ? data.map((v, i) => [i, v]) : Object.entries(data);
        const open = isArray ? '[' : '{';
        const close = isArray ? ']' : '}';
        
        if (entries.length === 0) {
            return `<span class="json-bracket">${open}${close}</span>${comma}`;
        }
        
        const id = 'n' + Math.random().toString(36).substr(2, 8);
        let html = `<span class="json-toggle" data-target="${id}" onclick="toggleNode(this)">`;
        html += `<span class="json-bracket">${open}</span></span>`;
        html += `<div class="json-content" id="${id}">`;
        
        entries.forEach(([key, val], i) => {
            const last = i === entries.length - 1;
            const keyHtml = isArray ? '' : `<span class="json-key">"${escHtml(key)}"</span>: `;
            html += `<div class="json-line">${keyHtml}${renderJson(val, indent + 1, last)}</div>`;
        });
        
        html += `</div><span class="json-ellipsis"> ${entries.length} items… </span>`;
        html += `<span class="json-bracket">${close}</span>${comma}`;
        return html;
    }
    
    function toggleNode(el) {
        el.classList.toggle('collapsed');
        const target = document.getElementById(el.dataset.target);
        target.classList.toggle('hidden');
    }
    
    // Render
    const container = document.getElementById('json-container');
    container.innerHTML = renderJson(jsonData, 0, true);
    
    // Stats
    const jsonStr = JSON.stringify(jsonData);
    const kb = (jsonStr.length / 1024).toFixed(1);
    document.getElementById('stats').textContent = `${kb} KB`;
    
    // Auto-collapse large arrays/objects at depth > 1
    document.querySelectorAll('.json-toggle').forEach(el => {
        const content = document.getElementById(el.dataset.target);
        if (content && content.children.length > 20) {
            el.classList.add('collapsed');
            content.classList.add('hidden');
        }
    });
    
    // Search
    const searchInput = document.getElementById('search');
    let searchTimeout;
    searchInput.addEventListener('input', function() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(doSearch, 200);
    });
    
    function doSearch() {
        const term = searchInput.value.trim().toLowerCase();
        const lines = container.querySelectorAll('.json-line');
        
        // Clear previous highlights
        container.querySelectorAll('.highlight').forEach(el => {
            el.outerHTML = el.textContent;
        });
        lines.forEach(l => l.classList.remove('search-no-match'));
        
        if (!term) return;
        
        // Expand all first
        container.querySelectorAll('.json-toggle.collapsed').forEach(el => {
            el.classList.remove('collapsed');
            document.getElementById(el.dataset.target).classList.remove('hidden');
        });
        
        lines.forEach(line => {
            const text = line.textContent.toLowerCase();
            if (text.includes(term)) {
                // Highlight matches in text nodes
                const walker = document.createTreeWalker(line, NodeFilter.SHOW_TEXT);
                const textNodes = [];
                while (walker.nextNode()) textNodes.push(walker.currentNode);
                textNodes.forEach(node => {
                    const idx = node.textContent.toLowerCase().indexOf(term);
                    if (idx >= 0) {
                        const span = document.createElement('span');
                        span.className = 'highlight';
                        const range = document.createRange();
                        range.setStart(node, idx);
                        range.setEnd(node, idx + term.length);
                        range.surroundContents(span);
                    }
                });
            } else {
                line.classList.add('search-no-match');
            }
        });
    }
