      "annotation_marker": "2",
      "annotation_type": "footnote",
      "annotation_text": "Screening and Post Enrollment (Randomization): Screening procedures are to be obtained within [redacted in source]. Specific procedures to be completed [redacted in source] are listed under [redacted in source] Visit.",
      "marker_locations": [
        {
          "table_number": 1,

    {
      "annotation_marker": "3",
      "annotation_type": "footnote",
      "annotation_text": "Informed Consent: Pre-screening or Screening Consent for this study must be obtained prior to undergoing any study specific procedures.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 4
        }
      ],
      "annotation_text_source": {

      }
    },
    {
      "annotation_marker": "4",
      "annotation_type": "footnote",
      "annotation_text": "Medical History: Includes history of disease process other than the cancer under study (active or resolved) and concurrent illness. Includes any current medical treatments for any condition. Demographic data collection will take place as part of the Screening Visit and will include the collection of sex, age, race and ethnicity.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 6
        }
      ],
      "annotation_text_source": {
        "method": "visual_transcription",
        "note": "Footnote printed below the table frame on doc p.124, which is a full-page raster image with no text layer."
      }
    },
    {
      "annotation_marker": "5",
      "annotation_type": "footnote",
      "annotation_text": "Viral/bacterial/protozoal assessment by IgG and IgM serology tests, and reflex PCR in case of IgM seropositive result whenever clinically appropriate, except for CMV for which IgG serology test and DNA PCR (instead of IgM serology test) should be performed: Cytomegalovirus (CMV), Epstein Barr virus (EBV), human immunodeficiency virus (HIV)-1, HIV-2, hepatitis B (HBV, HbsAG, antiHBc, antiHbs), hepatitis C (HCV). IGRA for Latent TB. For subjects living in or travelling to endemic areas screening should be considered for West Nile Virus, Strongyloides, Cocciomycosis, and, Histoplamosis. Serum Aspergillus galactomannan antigen should be sent in high-risk patients.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 7
        }
      ],
      "annotation_text_source": {
        "method": "visual_transcription",
        "note": "Footnote printed below the table frame on doc p.124, which is a full-page raster image with no text layer."
      }
    },
    {
      "annotation_marker": "6",
      "annotation_type": "footnote",
      "annotation_text": "Physical examination (PE): Physical examination (with neurologic exam) will include weight and height. Height will only be required [redacted in source].",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 10
        }
      ],
      "annotation_text_source": {
        "method": "visual_transcription",
        "note": "Footnote printed below the table frame on doc p.124, which is a full-page raster image with no text layer."
      }
    },
    {
      "annotation_marker": "7",
      "annotation_type": "footnote",
      "annotation_text": "Vital Signs: Includes temperature (oral, tympanic, temporal or axillary), blood pressure (BP), pulse rate and oxygen saturation level. Oxygen saturation will be evaluated by pulse oximetry. On [redacted in source], to be performed [redacted in source].",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 11
        }
      ]
    },
    {
      "annotation_marker": "8",
      "annotation_type": "footnote",
      "annotation_text": "ICE Assessment/ ICANS. Conduct immune effector cell-associated encephalopathy (ICE) score at screening. Conduct ICE score and immune effector cell-associated neurotoxicity syndrome (ICANS) grading as clinically indicated, starting on [redacted in source] ICE and ICANS grading scales are provided in Appendix 8.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 13
        }
      ]
    },
    {
      "annotation_marker": "9",
      "annotation_type": "footnote",
      "annotation_text": "12 Lead electrocardiogram (ECG): At each time point, 12 lead ECG will be performed to determine cardiac safety and QTcF interval. On [redacted in source], ECG will be performed prior to investigational product administration. If the QTcF is prolonged (>500 msec), the ECG should be re-evaluated by a qualified person at the institution for confirmation.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 14
        }
      ]
    },
    {
      "annotation_marker": "10",
      "annotation_type": "footnote",
      "annotation_text": "Donor-specific anti-human leukocyte antigen (HLA) antibodies (DSA): Screening: Samples will be collected and sent to a central laboratory for processing and analysis after the subject signs the pre-screening or screening informed consent form. Donor-specific anti-HLA antibodies must be repeated prior to [redacted in source] if subject receives blood transfusion (ie, red blood cells, platelets, plasma) after an initial negative result to confirm eligibility.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 17
        }
      ]
    },
    {
      "annotation_marker": "11",
      "annotation_type": "footnote",
      "annotation_text": "CBC Hematology: complete blood count (CBC) with differential (should include % and absolute number of neutrophils, lymphocytes, monocytes, eosinophils, basophils, and reticulocyte count), hemoglobin, hematocrit, platelet counts. On [redacted in source], hematology will be performed [redacted in source]. On [redacted in source], samples will be collected [redacted in source] infusion.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 18
        }
      ]
    },
    {
      "annotation_marker": "12",
      "annotation_type": "footnote",
      "annotation_text": "Blood Chemistry (fasting not required): should include: alanine aminotransferase (ALT), albumin, alkaline phosphatase, aspartate aminotransferase (AST), bicarbonate, total bilirubin, blood urea nitrogen (BUN), chloride, serum calcium, creatinine, creatinine clearance, glucose, lactate dehydrogenase, magnesium, sodium, phosphorus or phosphate, total protein, potassium, uric acid, serum ferritin, C-reactive protein (CRP). On [redacted in source], chemistry will be performed prior to start of lymphodepletion treatment. On [redacted in source] samples will be collected prior to ALLO-501A infusion.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 19
        }
      ]
    },
    {
      "annotation_marker": "13",
      "annotation_type": "footnote",
      "annotation_text": "Coagulation: fibrinogen and D-dimer, partial thromboplastin time (PTT) and International Normalized Ratio (INR) or prothrombin time.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 20
        }
      ]
    },
    {
      "annotation_marker": "14",
      "annotation_type": "footnote",
      "annotation_text": "Reflex auto-antibodies will be evaluated in case of suspected ALLO-647 treatment emergent autoimmunity AE. Depending on the type of AE, the tests should include (but not limited to) serum antiphospholipid antibodies (APA), platelet-bound APA, anti-Factor VIII antibodies, anti-Thyroid Peroxidase (anti-TPO), anti-Thyroglobulin (anti-TG) and anti-thyroid stimulating hormone (anti-TSH receptor), Coombs test, antinuclear antibodies (ANA), perinuclear anti-neutrophil cytoplasmic antibodies (P-ANCA), anti-neutrophil cytoplasmic antibodies (cANCA), and/or anti-Sjogren’s syndrome type B (anti-SSB).",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 21
        }
      ]
    },
    {
      "annotation_marker": "15",
      "annotation_type": "footnote",
      "annotation_text": "Urinalysis: Urine dipstick for protein, glucose, and blood: If positive collect 24 hr and/or microscopic cell count (Reflex Testing).",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 23
        }
      ]
    },
    {
      "annotation_marker": "16",
      "annotation_type": "footnote",
      "annotation_text": "Pregnancy test and contraception check: Serum or urine pregnancy test for females of childbearing potential. Follicle stimulating hormone test may be performed for post-menopausal women. Contraception use will be checked to confirm that contraception is used consistently and correctly.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 27
        }
      ]
    },
    {
      "annotation_marker": "17",
      "annotation_type": "footnote",
      "annotation_text": "Replication competent lentivirus (RCL): Whole blood samples will be collected to monitor for the presence of RCL-specific DNA sequences by a validated PCR-based assay. Samples may be analyzed for RCL only [redacted in source]; if negative, then remaining samples [redacted in source] may be collected and archived. Assess for RCL upon diagnosis of a new (secondary) malignancy.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 28
        }
      ]
    },
    {
      "annotation_marker": "18",
      "annotation_type": "footnote",
      "annotation_text": "Quantitative serum immunoglobulins (local analysis): Humoral immunity will be monitored by the measurement of serum IgG, IgA, and IgM levels. On [redacted in source], samples will be collected prior to investigational product administration.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 32
        }
      ]
    },
    {
      "annotation_marker": "19",
      "annotation_type": "footnote",
      "annotation_text": "Lymphodepletion: • Fludarabine (FC and FCA arms): 30 mg/m²/day fludarabine will be administered IV over approximately 15 to 30 minutes for 3 days, from Day -5 to Day -3. The fludarabine dose should be adjusted based on renal function; for subjects with creatinine clearance <80 mL/min, the fludarabine dose should be 20 mg/m² on each of the 3 dosing days or as per institutional guidelines. • Cyclophosphamide (FC and FCA arms): 300 mg/m²/day cyclophosphamide will be administered by IV over approximately 1 hr for 3 days, from Day -5 to Day -3. • ALLO-647 (FCA arm only): Administer 30 mg/d IV over approximately 4 hrs each day. For FCA-90, 30 mg/day x 3 days, from Day -5 to Day -3.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 33
        },
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 34
        },
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 35
        },
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 36
        }
      ]
    },
    {
      "annotation_marker": "20",
      "annotation_type": "footnote",
      "annotation_text": "Lymphoma assessments by positron emission tomography (PET)/computerized tomography (CT): tumor assessments will include all known or suspected disease sites. Disease-specific imaging as clinically appropriate will be performed as described in the study imaging manual. All scans will also be sent to a central radiology vendor, as specified in the study imaging manual. If a PET/CT was performed within [redacted in source] prior to Screening, then the results may be used for Screening disease assessment and a Screening PET/CT does not need to be done, providing there was no intervening therapy between the time of the PET/CT and Screening. Radiographic disease assessment will not be required after documented disease progression per Lugano criteria or initiation of subsequent anti-cancer therapy.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 41
        }
      ]
    },
    {
      "annotation_marker": "21",
      "annotation_type": "footnote",
      "annotation_text": "Brain MRI: Subjects with a history of CNS disease: screening brain MRI must be stable as compared to previous brain MRI scan.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 42
        }
      ]
    },
    {
      "annotation_marker": "22",
      "annotation_type": "footnote",
      "annotation_text": "Bone Marrow Biopsy and Aspirate: Bone marrow biopsy and aspirate will be completed [redacted in source], and at the time complete response (CR) is suspected only if bone marrow infiltration is positive or unknown at screening. Samples (screening; others as indicated) will be banked, and may be analyzed for insertion site analysis, molecular analysis, and other similar analyses. Proceduralist should aim to achieve a 2cm core to best assess cellularity.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 43
        }
      ]
    },
    {
      "annotation_marker": "23",
      "annotation_type": "footnote",
      "annotation_text": "Lymphoma biopsy: An archival formalin-fixed paraffin-embedded (FFPE) cancer tissue block from initial diagnosis, or previously obtained cancer tissue biopsy obtained prior to screening, may be submitted in place of a fresh sample, if obtained within [redacted in source] and if the subject received no intervening systemic anti-cancer treatment during this period. Cancer tissue from cytological sampling (eg, fine needle aspirates, including FFPE cell pelletthe material) is not adequate and should not be submitted. The FFPE tissue blocks must be of sufficient size to obtain approximately 22-26 unstained slides which should be submitted to the central laboratory. For subjects who undergo a fresh biopsy [redacted in source], or an on-treatment biopsy, a total of 3 core biopsies are to be obtained when possible for translational analyses.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 44
        }
      ]
    },
    {
      "annotation_marker": "24",
      "annotation_type": "footnote",
      "annotation_text": "MRD assessment: A plasma sample will be collected for MRD analysis using ClonoSeq or equivalent testing.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 45
        }
      ]
    },
    {
      "annotation_marker": "25",
      "annotation_type": "footnote",
      "annotation_text": "EQ-5D-5L (PRO) and QLQ-C30 (PRO): Completion of these instruments is not required after documented disease progression per Lugano criteria or initiation of subsequent anti-cancer therapy.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 52
        },
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 53
        }
      ]
    },
    {
      "annotation_marker": "26",
      "annotation_type": "footnote",
      "annotation_text": "ALLO-501A in blood (flow cytometry): A blood sample will be collected to quantify ALLO-501A by a validated flow cytometry-based cellular-kinetics assay on [redacted in source], and at the indicated time points by central laboratory. Phenotypic subsets of CAR + T cells such as memory, activated and exhausted populations may also be characterized.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 55
        }
      ]
    },
    {
      "annotation_marker": "27",
      "annotation_type": "footnote",
      "annotation_text": "ALLO-501A in blood (transgene levels): A blood sample will be collected into a tube optimized for DNA isolation on [redacted in source], at the end of infusion on [redacted in source] (ie, within 30 min after infusion), and at the indicated time points to quantify ALLO-501A transgene levels by a validated qPCR-based transgene assay, performed by central laboratory.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 56
        }
      ]
    },
    {
      "annotation_marker": "28",
      "annotation_type": "footnote",
      "annotation_text": "ALLO-501A detection in lymph node, BM, and CSF: A sample of the indicated tissues will be evaluated to investigate the quantity of ALLO-501A in tissue compartments that may harbor tumor cells as clinically indicated. ALLO-501A may be measured by flow cytometry and/or qPCR-based assays by central laboratory. If subject experiences prolonged (>42 days) cytopenia a bone marrow aspirate will be collected for TCR clonality assessment, central CAR flow cytometry analysis, VCN and potential RNASeq. CSF will be collected, as clinically indicated, at any time if Grade 3 and above ALLO-501A related neurological AEs and/or suspected encephalitis are observed. In addition to the ALLO-501A detection, infectious workup (including HHV) may also be performed with the CSF sample collected.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 57
        },
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 58
        },
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 59
        }
      ]
    },
    {
      "annotation_marker": "29",
      "annotation_type": "footnote",
      "annotation_text": "ALLO-647 pharmacokinetics (PK) assessment (FCA arm only): Blood samples will be collected at each time point for PK analysis of ALLO-647. ALLO-647 serum concentration will be measured by immunoassay during and following ALLO-647 infusions at the following time-points: FCA-90: on [redacted in source] pre-dose, and end of infusion (within 15 minutes), [redacted in source] pre-dose, and end of infusion (within 15 minutes), [redacted in source] pre-dose, and end of infusion (within 15 minutes). [redacted in source] collect sample pre-ALLO-501A infusion, and at subsequent days as shown in the schedule. Testing will be performed at a central laboratory.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 60
        }
      ]
    },
    {
      "annotation_marker": "30",
      "annotation_type": "footnote",
      "annotation_text": "Fludarabine and cyclophosphamide pharmacokinetics (PK) assessment (FC and FCA arms): Blood samples will be collected at each time point for PK analysis of fludarabine and cyclophosphamide. Fludarabine and cyclophosphamide concentration will be measured by immunoassay during and following fludarabine and cyclophosphamide infusions at the following time-points: on [redacted in source] pre-dose, end of fludarabine infusion (within 15 minutes), end of cyclophosphamide infusion (within 15 minutes), [redacted in source] pre-dose, end of fludarabine infusion (within 15 minutes), end of cyclophosphamide infusion (within 15 minutes), [redacted in source] pre-dose, and end of fludarabine infusion (within 15 minutes), end of cyclophosphamide infusion (within 15 minutes). [redacted in source] collect sample pre-ALLO-501A infusion, and at subsequent days as shown in the schedule. Testing will be performed at a central laboratory.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 61
        }
      ]
    },
    {
      "annotation_marker": "31",
      "annotation_type": "footnote",
      "annotation_text": "Cytokines and Soluble Proteins: Analysis will be completed at a central lab. Serum cytokines assessed for cytokine release syndrome (CRS) safety management will be managed locally. On [redacted in source], the cytokine assessment (blood) will be performed prior to start of lymphodepletion treatment. On [redacted in source], samples will be collected prior to ALLO-501A infusion.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 62
        }
      ]
    },
    {
      "annotation_marker": "32",
      "annotation_type": "footnote",
      "annotation_text": "Anti-ALLO-501A Antibodies (anti-scFv and anti-TALEN antibodies): A blood sample will be collected into a tube optimized for serum isolation to monitor for the development of ALLO-501A and TALEN-specific antibodies. Testing will be performed at a central laboratory.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 64
        }
      ]
    },
    {
      "annotation_marker": "33",
      "annotation_type": "footnote",
      "annotation_text": "Anti-ALLO-647 Anti-Drug-Antibodies (FCA arm only): circulating levels of human anti-ALLO-647 antibodies will be assessed in serum by immunoassays up to [redacted in source] or up to 2 consecutive negative tests post-dosing completion whichever is the latest. Neutralizing antibody testing will be performed only in case of positive anti-drug antibody (ADA). Testing will be performed at a central laboratory.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 65
        }
      ]
    },
    {
      "annotation_marker": "34",
      "annotation_type": "footnote",
      "annotation_text": "Donor-specific anti-human leukocyte antigen (HLA) antibodies (DSA): (On study): Binding of C1q to HLA Class I and II DSA will be tested in case of positive DSA results following [redacted in source].",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 66
        }
      ]
    },
    {
      "annotation_marker": "35",
      "annotation_type": "footnote",
      "annotation_text": "TBNK Assay: A blood sample will be collected for the enumeration of T, B, and natural killer (NK) cells by a flow cytometry-based assay to monitor the depth and duration of lymphodepletion. Samples will be collected before administration of ALLO-647 ([redacted in source]) or ALLO-501A ([redacted in source]). Testing will be performed at a central laboratory.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 68
        }
      ]
    },
    {
      "annotation_marker": "36",
      "annotation_type": "footnote",
      "annotation_text": "Gene expression (RNA) profile: Gene expression in whole blood associated with CART cell phenotype, activation state, and anti-tumor activity will be measured by RNA sequencing in blood, and bone marrow if bone marrow is collected to monitor response. Testing will be performed at a central laboratory.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 69
        }
      ]
    },

    function escHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    
    function renderJson(data, indent, isLast) {
        const comma = isLast ? '' : '<span class="json-comma">,</span>';
        if (data === null) return `<span class="json-null">null</span>${comma}`;
        if (typeof data === 'boolean') return `<span class="json-boolean">${data}</span>${comma}`;
        if (typeof data === 'number') return `<span class="json-number">${data}</span>${comma}`;
        if (typeof data === 'string') return `<span class="json-string">"${escHtml(data)}"</span>${comma}`;
        
        const isArray = Array.isArray(data);
        const entries = isArray ? data.map((v, i) => [i, v]) : Object.entries(data);
        const open = isArray ? '[' : '{';
        const close = isArray ? ']' : '}';
        
        if (entries.length === 0) {
            return `<span class="json-bracket">${open}${close}</span>${comma}`;
        }
        
        const id = 'n' + Math.random().toString(36).substr(2, 8);
        let html = `<span class="json-toggle" data-target="${id}" onclick="toggleNode(this)">`;
        html += `<span class="json-bracket">${open}</span></span>`;
        html += `<div class="json-content" id="${id}">`;
        
        entries.forEach(([key, val], i) => {
            const last = i === entries.length - 1;
            const keyHtml = isArray ? '' : `<span class="json-key">"${escHtml(key)}"</span>: `;
            html += `<div class="json-line">${keyHtml}${renderJson(val, indent + 1, last)}</div>`;
        });
        
        html += `</div><span class="json-ellipsis"> ${entries.length} items… </span>`;
        html += `<span class="json-bracket">${close}</span>${comma}`;
        return html;
    }
    
    function toggleNode(el) {
        el.classList.toggle('collapsed');
        const target = document.getElementById(el.dataset.target);
        target.classList.toggle('hidden');
    }
    
    // Render
    const container = document.getElementById('json-container');
    container.innerHTML = renderJson(jsonData, 0, true);
    
    // Stats
    const jsonStr = JSON.stringify(jsonData);
    const kb = (jsonStr.length / 1024).toFixed(1);
    document.getElementById('stats').textContent = `${kb} KB`;
    
    // Auto-collapse large arrays/objects at depth > 1
    document.querySelectorAll('.json-toggle').forEach(el => {
        const content = document.getElementById(el.dataset.target);
        if (content && content.children.length > 20) {
            el.classList.add('collapsed');
            content.classList.add('hidden');
        }
    });
    
    // Search
    const searchInput = document.getElementById('search');
    let searchTimeout;
    searchInput.addEventListener('input', function() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(doSearch, 200);
    });
    
    function doSearch() {
        const term = searchInput.value.trim().toLowerCase();
        const lines = container.querySelectorAll('.json-line');
        
        // Clear previous highlights
        container.querySelectorAll('.highlight').forEach(el => {
            el.outerHTML = el.textContent;
        });
        lines.forEach(l => l.classList.remove('search-no-match'));
        
        if (!term) return;
        
        // Expand all first
        container.querySelectorAll('.json-toggle.collapsed').forEach(el => {
            el.classList.remove('collapsed');
            document.getElementById(el.dataset.target).classList.remove('hidden');
        });
        
        lines.forEach(line => {
            const text = line.textContent.toLowerCase();
            if (text.includes(term)) {
                // Highlight matches in text nodes
                const walker = document.createTreeWalker(line, NodeFilter.SHOW_TEXT);
                const textNodes = [];
                while (walker.nextNode()) textNodes.push(walker.currentNode);
                textNodes.forEach(node => {
                    const idx = node.textContent.toLowerCase().indexOf(term);
                    if (idx >= 0) {
                        const span = document.createElement('span');
                        span.className = 'highlight';
                        const range = document.createRange();
                        range.setStart(node, idx);
                        range.setEnd(node, idx + term.length);
                        range.surroundContents(span);
                    }
                });
            } else {
                line.classList.add('search-no-match');
            }
        });
    }
    </script>
