      "annotation_type": "footnote",
      "annotation_text": "Brief physical examination should be done at all visits where a physical examination is indicated except Week 26 and Week 52, where a complete physical examination should be performed Additional physical exams may be done at the discretion of the PI.",

    {
      "annotation_id": "annot-003",
      "table_id": "table-003",
      "annotation_marker": "b",
      "annotation_type": "footnote",
      "annotation_text": "Refer to Table 9.7.8.2.1 for laboratory assessments to be included and for complement panel tests, and to Table 9.7.8.4.1 for liver tests (LTs). LT assessment may be checked more frequently when ALT values are > ULN or ≥ 1.5x baseline value or based upon discussion between the Medical Monitor and the Investigator. Subjects with > ULN or ≥ 1.5x baseline value during the study and either an alternative etiology considered or for further evaluation of the lab abnormality may undergo additional evaluations (eg, imaging studies including MRI or ultrasound, additional blood tests, and/or liver biopsy) at the discretion of the Investigator. Additional testing of FVIII and LTs during any study week may be performed if: the ALT has increased to ≥ 1.5x baseline value or >ULN or after a discussion between the Medical Monitor and the Investigator based on a review of subject data. If FVIII levels and/or ALT values are stable over the course of several weeks, assessment of FVIII activity and ALT levels may be adjusted based on discussion between the Medical Monitor and the Investigator. In case of a safety concern, additional unscheduled laboratory tests may be performed locally (at the Investigator’s discretion) in order to facilitate timely and appropriate clinical management decisions; where possible, a matched sample for testing at the central laboratory should be collected (using the Unscheduled Visit lab kit) at the same time as the local unscheduled sample. While exploratory samples for cytokine profiling will be collected at the time points indicated above, testing of these samples will be performed only as deemed necessary by the Sponsor.",

    {
      "annotation_id": "annot-004",
      "table_id": "table-003",
      "annotation_marker": "c",
      "annotation_type": "footnote",
      "annotation_text": "Includes FVIII activity level (chromogenic substrate FVIII assay and one-stage clotting FVIII assay), chromogenic Nijmegen-Bethesda Assay for hFVIII inhibitor level, and coagulation exploratory assay. Chromogenic Nijmegen-Bethesda Assay for hFVIII inhibitor level will be tested as deemed necessary by the Sponsor. If a subject has used FVIII within 72 hours of a measurement day, all efforts should be made to obtain FVIII activity measurements when a 72-hour interval without FVIII use is achieved; the 72-hour wash-out period is only intended for subjects who have achieved FVIII ≥ 5 IU/dL at 16 weeks after BMN 270 infusion and who have not resumed FVIII replacement therapy. If FVIII levels are elevated or stable over the course of several weeks, assessment of FVIII activity may be adjusted based on discussion between the Medical Monitor and the Investigator. A D-dimer may be considered under circumstances in which FVIII activity levels are above the normal physiological range and/or if there is a concern for a venous thromboembolism.",

      "annotation_marker": "e",
      "annotation_type": "footnote",
      "annotation_text": "Blood samples will be collected to evaluate biochemical, molecular, cellular, and genetic/genomic aspects relevant to hemophilia A, coagulation, and/or AAV gene transfer, and to develop assays used for these evaluations. Subjects may choose to opt out of the exploratory genetic/genomic research being done to study or try to discover genes that are not yet known to be associated with hemophilia A. While exploratory samples will be collected at the time points indicated above, testing of these samples (including those for any other exploratory assessments) will be performed only as deemed necessary by the Sponsor.",

    function renderJson(data, indent, isLast) {

        if (typeof data === 'number') return `<span class="json-number">${data}</span>${comma}`;
        if (typeof data === 'string') return `<span class="json-string">"${escHtml(data)}"</span>${comma}`;
        
        const isArray = Array.isArray(data);
        const entries = isArray ? data.map((v, i) => [i, v]) : Object.entries(data);
        const open = isArray ? '[' : '{';
        const close = isArray ? ']' : '}';
        
        if (entries.length === 0) {
            return `<span class="json-bracket">${open}${close}</span>${comma}`;
        }
        
        const id = 'n' + Math.random().toString(36).substr(2, 8);
        let html = `<span class="json-toggle" data-target="${id}" onclick="toggleNode(this)">`;
        html += `<span class="json-bracket">${open}</span></span>`;
        html += `<div class="json-content" id="${id}">`;
        
        entries.forEach(([key, val], i) => {
            const last = i === entries.length - 1;
            const keyHtml = isArray ? '' : `<span class="json-key">"${escHtml(key)}"</span>: `;
            html += `<div class="json-line">${keyHtml}${renderJson(val, indent + 1, last)}</div>`;
        });
        
        html += `</div><span class="json-ellipsis"> ${entries.length} items… </span>`;
        html += `<span class="json-bracket">${close}</span>${comma}`;
        return html;
    }
    
    function toggleNode(el) {
        el.classList.toggle('collapsed');
        const target = document.getElementById(el.dataset.target);
        target.classList.toggle('hidden');
    }
    
    // Render
    const container = document.getElementById('json-container');
    container.innerHTML = renderJson(jsonData, 0, true);
    
    // Stats
    const jsonStr = JSON.stringify(jsonData);
    const kb = (jsonStr.length / 1024).toFixed(1);
    document.getElementById('stats').textContent = `${kb} KB`;
    
    // Auto-collapse large arrays/objects at depth > 1
    document.querySelectorAll('.json-toggle').forEach(el => {
        const content = document.getElementById(el.dataset.target);
        if (content && content.children.length > 20) {
            el.classList.add('collapsed');
            content.classList.add('hidden');
        }
    });
    
    // Search
    const searchInput = document.getElementById('search');
    let searchTimeout;
    searchInput.addEventListener('input', function() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(doSearch, 200);
    });
    
    function doSearch() {
        const term = searchInput.value.trim().toLowerCase();
        const lines = container.querySelectorAll('.json-line');
        
        // Clear previous highlights
        container.querySelectorAll('.highlight').forEach(el => {
            el.outerHTML = el.textContent;
        });
        lines.forEach(l => l.classList.remove('search-no-match'));
        
        if (!term) return;
        
        // Expand all first
        container.querySelectorAll('.json-toggle.collapsed').forEach(el => {
            el.classList.remove('collapsed');
            document.getElementById(el.dataset.target).classList.remove('hidden');
        });
        
        lines.forEach(line => {
            const text = line.textContent.toLowerCase();
            if (text.includes(term)) {
                // Highlight matches in text nodes
                const walker = document.createTreeWalker(line, NodeFilter.SHOW_TEXT);
                const textNodes = [];
                while (walker.nextNode()) textNodes.push(walker.currentNode);
                textNodes.forEach(node => {
                    const idx = node.textContent.toLowerCase().indexOf(term);
                    if (idx >= 0) {
                        const span = document.createElement('span');
                        span.className = 'highlight';
                        const range = document.createRange();
                        range.setStart(node, idx);
                        range.setEnd(node, idx + term.length);
                        range.surroundContents(span);
                    }
                });
            } else {
                line.classList.add('search-no-match');
            }
        });
    }
    </script>
</body>
