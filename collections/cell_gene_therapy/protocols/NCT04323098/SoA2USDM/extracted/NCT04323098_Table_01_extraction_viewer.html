    {
      "annotation_marker": "*",
      "annotation_type": "footnote",
      "annotation_text": "Screening assessments should be performed within 28 days of BMN 270 infusion (and must be performed within 42 days prior to BMN 270 infusion).",
      "marker_locations": [
        {
          "table_number": 1,

        }

    {
      "annotation_marker": "a",
      "annotation_type": "footnote",
      "annotation_text": "Complete physical examination should be done at Screening. Brief physical examination may be done at Baseline and at the BMN 270 Infusion Visit.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 7
        }
      ]
    },
    {
      "annotation_marker": "b",
      "annotation_type": "footnote",
      "annotation_text": "Diaries should be distributed to subjects who have consented to participate in the study and who have been determined to meet all study eligibility criteria.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 12
        }
      ]
    },
    {
      "annotation_marker": "c",
      "annotation_type": "footnote",
      "annotation_text": "All patients must have a liver ultrasound performed during the Screening period to screen for significant liver disease and hepatocellular carcinoma. A FibroScan may also be performed at the discretion of the Investigator.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 14
        }
      ]
    },
    {
      "annotation_marker": "d",
      "annotation_type": "footnote",
      "annotation_text": "Includes baseline FVIII activity (chromogenic substrate FVIII assay and one-stage clotting FVIII assay), coagulation exploratory assay, chromogenic Nijmegen-Bethesda Assay for hFVIII inhibitor level, and hFVIII protein assay. Baseline activity should be assessed at trough (at least >72 hours after last dose of replacement FVIII therapy, or 5x the known half-life of the FVIII concentrates administered).",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 15
        }
      ]
    },
    {
      "annotation_marker": "e",
      "annotation_type": "footnote",
      "annotation_text": "Patients with documented negative results within the last 30 days do not need to be retested. Hepatitis B screening should include hepatitis B surface antigen (HBsAg), hepatitis B surface antibody (HBsAb), and hepatitis B core antibody (HBcAb).",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 17
        }
      ]
    },
    {
      "annotation_marker": "f",
      "annotation_type": "footnote",
      "annotation_text": "SARS-CoV-2 RT-PCR testing is required during Screening, and all subjects must have at least one negative test result prior to dosing. If the test is performed locally an additional 2nd test is recommended, but if performed negative results from the 2nd test must be received prior to dosing. A SARS-CoV-2 vaccine is recommended for subjects if indicated and if available. If a two-step SARS-CoV-2 vaccine is being used, sites should consider using the flexible re-screen option to allow subjects to receive both doses at least 14 days prior to treatment with BMN 270 (or at least 30 days prior to treatment with BMN 270 for any live-virus vaccines). It is preferable for SARS-CoV-2 vaccination to occur prior to BMN 270 infusion. Investigators should use clinical judgment, taking into consideration local factors, individual risk factors, and benefit/risk related to timing of vaccine administration.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 18
        }
      ]
    },
    {
      "annotation_marker": "g",
      "annotation_type": "footnote",
      "annotation_text": "Refer to Table 9.7.8.2.1 for laboratory assessments to be included, and to Table 9.7.8.4.1 for liver tests. ABO blood typing assessment should be performed at Screening.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 19
        },
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 25
        },
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 26
        }
      ]
    },
    {
      "annotation_marker": "h",
      "annotation_type": "footnote",
      "annotation_text": "Screening, Smart Re-screening, and Infusion Day samples will be tested using the CDx AAV5 total antibody (TAb) assay. During Screening, the CDx AAV5 TAb assay test may be done first, under a standalone informed consent form, before the main ICF for the study is signed and further screening procedures are performed. If performed during the early Screening period, the CDx AAV5 TAb assessment does not need to be repeated as part of general Screening. Sample collection on the day of the infusion visit must be performed before the BMN 270 infusion is given.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 27
        }
      ]
    },
    {
      "annotation_marker": "i",
      "annotation_type": "footnote",
      "annotation_text": "Includes HLA genotyping and FVIII genotyping.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 31
        },
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 32
        }
      ]
    },
    {
      "annotation_marker": "j",
      "annotation_type": "footnote",
      "annotation_text": "Blood samples will be collected to evaluate biochemical, molecular, cellular, immunological, and genetic/genomic aspects relevant to hemophilia A, coagulation, and/or AAV gene transfer, and to develop assays used for these evaluations. Subjects may choose to opt out of the exploratory genetic/genomic research being done to study or try to discover genes that are not yet known to be associated with hemophilia A. While exploratory samples will be collected at the time points indicated above, testing of these samples will be performed only as deemed necessary by the Sponsor.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 33
        }
      ]
    },
    {
      "annotation_marker": "k",
      "annotation_type": "footnote",
      "annotation_text": "Complement panel should include C3, C3a, C4, Bb, and sC5b-9 (refer to Table 9.7.8.2.1) and should be collected 2 hours after completion of the infusion. While exploratory samples for cytokine profiling will be collected at the time points indicated above, testing of these samples will be performed only as deemed necessary by the Sponsor.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 42
        },
        {
          "table_number": 1,
          "location_type": "schedule_cell",
          "row_position": 42,
          "column_position": 6
        }
      ]
    },
    {
      "annotation_marker": "l",
      "annotation_type": "footnote",
      "annotation_text": "In case of a Grade 2 or higher hypersensitivity or adverse drug reaction, a safety assessment including physical examination and vital signs will be performed and additional blood samples will be collected within 1 hour, and 8-24 hours following the hypersensitivity reaction for assessment of complement (C3, C3a, C4, Bb, and sC5b-9) and tryptase. Additional samples will be collected at the 1 hour and 8-24 hour time points and, if possible, 1 week after the event for optional exploratory cytokine profiling to assess inflammatory biomarkers and plasma cytokine levels. Inpatient observation can be extended and additional blood samples can be collected if deemed necessary at the discretion of the Investigator and Medical Monitor.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "activity_name",
          "row_position": 43
        },
        {
          "table_number": 1,
          "location_type": "schedule_cell",
          "row_position": 43,
          "column_position": 6
        }
      ]
    },
    {
      "annotation_marker": "m",
      "annotation_type": "footnote",
      "annotation_text": "Smart rescreening should only be performed if a patient has been determined to be eligible for the study and is unable to complete the Baseline assessments and Infusion prior to the closing of the original Screening window. SARS-CoV-2 RT-PCR testing is required during Screening, and all subjects must have at least one negative test result prior to dosing. If the test is performed locally an additional 2nd test is recommended, but if performed negative results from the 2nd test must be received prior to dosing. Subjects who undergo smart rescreening must complete the rescreening assessments and receive the infusion within 90 days of signing the original consent. Subjects who do not complete dosing within 90 days will be required to re-consent and undergo all screening procedures. Subjects may not undergo smart rescreening more than once.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "schedule_cell",
          "row_position": 3,
          "column_position": 4
        }
      ]
    },
    {
      "annotation_marker": "n",
      "annotation_type": "footnote",
      "annotation_text": "Should the screening visit occur within 30 days of infusion, physical examination, blood chemistry, LTs, hematology, and urine and coagulation tests do not need to be repeated at Baseline.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "schedule_cell",
          "row_position": 3,
          "column_position": 5
        }
      ]
    },
    {
      "annotation_marker": "o",
      "annotation_type": "footnote",
      "annotation_text": "With the exception of the collection of samples for polymerase chain reaction (PCR) vector DNA analysis and the collection of the complement panel/exploratory cytokine profiling sample, assessments on the day of infusion must be performed prior to the infusion. Subjects will fast for at least 8 hours prior to pre-infusion laboratory sampling on the day of the infusion visit. On the day of the BMN 270 Infusion, vital signs will be monitored prior to the infusion, during the infusion every 15 minutes (± 5 minutes), and following the infusion hourly (± 5 minutes) for at least 8 hours during the subject’s stay in the clinic. Shedding samples for PCR of vector DNA analysis (blood, saliva, urine, semen, stool) should be collected between 2 and 24 hours after the infusion has been completed.",
      "marker_locations": [
        {
          "table_number": 1,
          "location_type": "schedule_cell",
          "row_position": 3,
          "column_position": 6
        }
      ]
    },
    {
      "annotation_marker": "p",
      "annotation_type": "footnote",
      "annotation_text": "If the subject underwent early AAV5 TAb testing and was consented using the full study ICF, the ICF does not need to be re-administered and re-signed as part of regular Screening. If the subject underwent early AAV5 TAb testing and was consented using the dedicated stand-alone ICF for that purpose, the full ICF will need to be signed if the subject proceeds to regular Screening.",

    function escHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    
    function renderJson(data, indent, isLast) {
        const comma = isLast ? '' : '<span class="json-comma">,</span>';
        if (data === null) return `<span class="json-null">null</span>${comma}`;
        if (typeof data === 'boolean') return `<span class="json-boolean">${data}</span>${comma}`;
        if (typeof data === 'number') return `<span class="json-number">${data}</span>${comma}`;
        if (typeof data === 'string') return `<span class="json-string">"${escHtml(data)}"</span>${comma}`;
        
        const isArray = Array.isArray(data);
        const entries = isArray ? data.map((v, i) => [i, v]) : Object.entries(data);
        const open = isArray ? '[' : '{';
        const close = isArray ? ']' : '}';
        
        if (entries.length === 0) {
            return `<span class="json-bracket">${open}${close}</span>${comma}`;
        }
        
        const id = 'n' + Math.random().toString(36).substr(2, 8);
        let html = `<span class="json-toggle" data-target="${id}" onclick="toggleNode(this)">`;
        html += `<span class="json-bracket">${open}</span></span>`;
        html += `<div class="json-content" id="${id}">`;
        
        entries.forEach(([key, val], i) => {
            const last = i === entries.length - 1;
            const keyHtml = isArray ? '' : `<span class="json-key">"${escHtml(key)}"</span>: `;
            html += `<div class="json-line">${keyHtml}${renderJson(val, indent + 1, last)}</div>`;
        });
        
        html += `</div><span class="json-ellipsis"> ${entries.length} items… </span>`;
        html += `<span class="json-bracket">${close}</span>${comma}`;
        return html;
    }
    
    function toggleNode(el) {
        el.classList.toggle('collapsed');
        const target = document.getElementById(el.dataset.target);
        target.classList.toggle('hidden');
    }
    
    // Render
    const container = document.getElementById('json-container');
    container.innerHTML = renderJson(jsonData, 0, true);
    
    // Stats
    const jsonStr = JSON.stringify(jsonData);
    const kb = (jsonStr.length / 1024).toFixed(1);
    document.getElementById('stats').textContent = `${kb} KB`;
    
    // Auto-collapse large arrays/objects at depth > 1
    document.querySelectorAll('.json-toggle').forEach(el => {
        const content = document.getElementById(el.dataset.target);
        if (content && content.children.length > 20) {
            el.classList.add('collapsed');
            content.classList.add('hidden');
        }
    });
    
    // Search
    const searchInput = document.getElementById('search');
    let searchTimeout;
    searchInput.addEventListener('input', function() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(doSearch, 200);
    });
    
    function doSearch() {
        const term = searchInput.value.trim().toLowerCase();
        const lines = container.querySelectorAll('.json-line');
        
        // Clear previous highlights
        container.querySelectorAll('.highlight').forEach(el => {
            el.outerHTML = el.textContent;
        });
        lines.forEach(l => l.classList.remove('search-no-match'));
        
        if (!term) return;
        
        // Expand all first
        container.querySelectorAll('.json-toggle.collapsed').forEach(el => {
            el.classList.remove('collapsed');
            document.getElementById(el.dataset.target).classList.remove('hidden');
        });
        
        lines.forEach(line => {
            const text = line.textContent.toLowerCase();
            if (text.includes(term)) {
                // Highlight matches in text nodes
                const walker = document.createTreeWalker(line, NodeFilter.SHOW_TEXT);
                const textNodes = [];
                while (walker.nextNode()) textNodes.push(walker.currentNode);
                textNodes.forEach(node => {
                    const idx = node.textContent.toLowerCase().indexOf(term);
                    if (idx >= 0) {
                        const span = document.createElement('span');
                        span.className = 'highlight';
                        const range = document.createRange();
                        range.setStart(node, idx);
                        range.setEnd(node, idx + term.length);
                        range.surroundContents(span);
                    }
                });
            } else {
                line.classList.add('search-no-match');
            }
        });
    }
    </script>
</body>
